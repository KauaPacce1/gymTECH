<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gymTECH · Cadastro</title>
  <script src="./js/sessao.js"></script>
  <link rel="stylesheet" href="./css/auth.css" />
</head>
<body>
  <!--header inicio-->
  <div class="header">
    <div class="container">
      <a class="titulo" href="index.html">gym<span>TECH</span></a>
    </div>
  </div>

  <!--header fim-->
  <div class="login">
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>

    <div class="container">
      <div class="hero">
        <span class="eyebrow">Comece hoje</span>
        <h1>Seu primeiro treino <span>começa aqui.</span></h1>
        <p class="lead">Crie sua conta e registre sua primeira série em menos de um minuto.</p>
      </div>

      <div class="card card-cadastro">
        <h2>Criar conta</h2>
        <h3>Leva menos de um minuto para começar.</h3>

        <form id="registerForm" class="formulario" onsubmit="return register();">
          <div class="campo">
            <label for="input_name">Nome:</label>
            <input id="input_name" type="text" maxlength="45" placeholder="Seu nome" />
          </div>

          <div class="campo">
            <label for="input_email">E-mail:</label>
            <input id="input_email" type="email" maxlength="100" placeholder="voce@email.com" />
          </div>

          <div class="campo">
            <label for="input_password">Senha:</label>
            <input id="input_password" type="password" maxlength="45" placeholder="Mínimo de 8 caracteres" />
          </div>

          <div class="campo">
            <label for="input_confirmPassword">Confirmar Senha:</label>
            <input id="input_confirmPassword" type="password" maxlength="45" placeholder="Repita a senha" />
          </div>

          <div class="campo checkbox-row">
            <label for="input_terms">Li e aceito os termos de uso</label>
            <input id="input_terms" type="checkbox" />
          </div>

          <button class="botao" type="submit">Criar conta</button>

          <span>Já tem conta? <a href="login.html">Entrar</a></span>
        </form>

        <div id="div_aguardar" style="display: none;">Carregando...</div>
      </div>
    </div>
  </div>
</body>
</html>
<script>
  function register() {
    var nameVar = input_name.value.trim();
    var emailVar = input_email.value.trim();
    var passwordVar = input_password.value;
    var confirmPasswordVar = input_confirmPassword.value;
    var termsVar = input_terms.checked;


    clearMessage();

    if (nameVar == "") {
      showError("Preencha seu nome.");
      return false;
    } else if (!emailVar.includes('@') || !emailVar.includes('.')) {
      showError("Digite um e-mail válido.");
      return false;
    } else if (passwordVar.length < 8) {
      showError("A senha deve conter no mínimo 8 caracteres.");
      return false;
    } else if (passwordVar != confirmPasswordVar) {
      showError("As senhas não coincidem.");
      return false;
    } else if (!termsVar) {
      showError("Você precisa aceitar os termos de uso.");
      return false;
    }


    aguardar();

    fetch("/users/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        nameServer: nameVar,
        emailServer: emailVar,
        passwordServer: passwordVar,
      }),
    })
      .then(function (response) {
        if (response.ok) {
          limparFormulario();
          showError("Cadastro realizado com sucesso! Redirecionando para tela de Login...");
          setTimeout(function () { window.location = "login.html"; }, 2000);
        } else {
          showError("Não foi possível realizar o cadastro.");
          finalizarAguardar();
        }
      });
    return false;
  }

  function showError(text) {
    cardErro.style.display = "block";
    mensagem_erro.innerHTML = text;
  }

  function clearMessage() {
    cardErro.style.display = "none";
  }

  function limparFormulario() {
    document.getElementById("registerForm").reset();
  }
</script>
