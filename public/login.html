<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gymTECH · Login</title>
    <script src="./js/sessao.js"></script>
    <link rel="stylesheet" href="./css/auth.css">
</head>

<body>
    <!--Header-->
    <div class="header">
        <div class="container">
            <a class="titulo" href="index.html">gym<span>TECH</span></a>
        </div>
    </div>
    <!--header fim-->

    <div class="login">
        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>
        </div>

        <div class="container">
            <div class="hero">
                <span class="eyebrow">Registre · Acompanhe · Evolua</span>
                <h1>Cada série <span>conta.</span></h1>
                <p class="lead">Registre seus treinos e acompanhe a frequência e o volume de cada grupo muscular.</p>
            </div>

            <div class="card card-login">
                <h2>Entrar</h2>
                <h3>Acesse sua conta para registrar treinos e ver seus painéis.</h3>

                <form id="loginForm" class="formulario" onsubmit="return enter();">
                    <div class="campo">
                        <label for="email_input">E-mail:</label>
                        <input id="email_input" type="email" maxlength="100" placeholder="voce@email.com">
                    </div>

                    <div class="campo">
                        <label for="password_input">Senha:</label>
                        <input id="password_input" type="password" maxlength="45" placeholder="Sua senha">
                    </div>

                    <button class="botao" type="submit">Entrar</button>

                    <span>Ainda não tem conta? <a href="cadastro.html">Criar conta</a></span>
                </form>

                <div id="div_aguardar" style="display: none;">Carregando...</div>
                <div id="div_erros_login"></div>
            </div>
        </div>
    </div>
</body>

</html>
<script>
    var maxAttempts = 3;
    
    function enter() {
        sumirMensagem();
        if (maxAttempts <= 0) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = "Número máximo de tentativas atingido.";
            return false;
        }
        var emailVar = email_input.value.trim();
        var passwordVar = password_input.value;

        if (emailVar === "" || passwordVar === "") {
            cardErro.style.display = "block";
            mensagem_erro.textContent = "Preencha o e-mail e a senha.";
            return false;
        }

        aguardar();

        fetch("/usuarios/enter", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                passwordServer: passwordVar
            })
        }).then(function (response) {
            return response.json().then(function (data) {
                if (!response.ok) {
                    if (response.status === 403) {
                        maxAttempts--;
                        throw new Error(maxAttempts <= 0
                            ? "Número máximo de tentativas atingido."
                            : data.message + " Resta(m) " + maxAttempts + " tentativa(s).");
                    }
                    throw new Error(data.message || "Não foi possível realizar o login.");
                }

                sessionStorage.clear();
                sessionStorage.setItem("userEmail", data.email);
                sessionStorage.setItem("userName", data.name);
                sessionStorage.setItem("userId", data.id);
                document.getElementById("loginForm").reset();
                finalizarAguardar();
                window.location = "./dashboard/painel.html";
            });
        }).catch(function (error) {
            console.error("Erro no login:", error.message);
            finalizarAguardar(error.message || "Não foi possível conectar ao servidor. Tente novamente.");
        });
        return false;
    }
    
    function sumirMensagem() {
        cardErro.style.display = "none";
        document.getElementById("div_erros_login").textContent = "";
    }
</script>
