<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gymTECH · Treinos</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <script src="../js/sessao.js"></script>
</head>
<body>
    <!-- MENU LATERAL -->
    <div class="app">
        <div class="sidebar">
            <a class="logo" href="../index.html">gym<span>TECH</span></a>
            <div class="menu">
                <a href="painel.html" class="menu-item">Painel</a>
                <a href="#" class="menu-item menu-active">Meus treinos</a>
                <a href="../index.html" class="menu-item">Menu</a>
            </div>

            <!-- AVATAR -->
            <div class="user">
                <div class="avatar avatar-small js-iniciais"></div>
                <div class="user-info">
                    <strong class="js-nome"></strong>
                    <a href="../login.html" onclick="limparSessao()">Sair</a>
                </div>
            </div>
        </div>

        <div class="works-wrapper">
            <!-- CONTEÚDO PRINCIPAL-->
            <div class="content">
                <p id="mensagemErro" class="erro" hidden>Não foi possível carregar os dados.</p>

                <!-- HEADER -->
                <div class="topbar">
                    <div class="topbar-user">
                        <div class="avatar js-iniciais"></div>
                        <div>
                            <h1>Aqui estão os seus treinos, <span class="js-nome"></span></h1>
                            <p id="subtitulo" class="muted small"></p>
                        </div>
                    </div>
                    <a class="btn" onclick="openModalWork()">+ Registrar treino</a>
                </div>

                <!-- TREINOS RECENTES -->
                <section>
                    <h2>Histórico de treinos</h2><br>
                    <div id="workoutHistory" class="workout-history"></div>
                </section>
            </div>
        </div>
    </div>

    <!-- MODAL DE CADASTRO DE TREINOS -->
    <div id="modal_work" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h2 id="workoutModalTitle">Registrar treino</h2>
                    <p id="workoutModalDescription" class="muted small">Preencha os dados do seu treino.</p>
                </div>
                <button type="button" class="btn-fechar" onclick="closeModalWork()" aria-label="Fechar modal">
                    ×
                </button>
            </div>

            <form class="form" onsubmit="event.preventDefault(); registerWork();">
                <div class="form-field">
                    <label for="input_exerciseName">Nome do exercício</label>
                    <input type="text" id="input_exerciseName" placeholder="Ex.: Supino inclinado" maxlength="45" required>
                </div>

                <div class="form-field">
                    <span>Grupo muscular</span>
                    <select id="select_muscleGroup" required>
                        <option value="" disabled selected>Selecione um grupo</option>
                        <option>Peito</option>
                        <option>Costas</option>
                        <option>Ombros</option>
                        <option>Pernas</option>
                        <option>Biceps</option>
                        <option>Triceps</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="input_sets">Quantidade de séries</label>
                    <input type="number" id="input_sets" placeholder="Ex.: 3" min="1" required>
                </div>

                <div class="form-field">
                    <label for="input_workoutDate">Data do treino</label>
                    <input type="date" id="input_workoutDate" required>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="closeModalWork()">
                        Cancelar
                    </button>
                    <button type="submit" id="workoutSubmitButton" class="btn-confirm">
                        Registrar treino
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
    <script>
        validarSessao()

        var editingWorkoutId = null;

        // ABRIR E FECHAR OS MODAIS
        function openModalWork() {
            editingWorkoutId = null;
            document.querySelector("#modal_work form").reset();
            document.getElementById("workoutModalTitle").textContent = "Registrar treino";
            document.getElementById("workoutModalDescription").textContent = "Preencha os dados do seu treino.";
            document.getElementById("workoutSubmitButton").textContent = "Registrar treino";
            modal_work.style.display = "flex";
        }

        function closeModalWork() {
            modal_work.style.display = "none";
            editingWorkoutId = null;
        }


        var works = [];

        function renderWorkouts() {
            var history = document.getElementById("workoutHistory");
            history.innerHTML = "";

            if (works.length == 0) {
                history.textContent = "Você ainda não registrou treinos.";
                return;
            }

            var currentDate = "";
            var list;

            for (var i = 0; i < works.length; i++) {
                if (works[i].date != currentDate) { // Se mudou o dia, criar outro card.
                    currentDate = works[i].date;

                    var card = document.createElement("div");
                    card.className = "card workout-card";

                    var title = document.createElement("h3");
                    title.textContent = currentDate;

                    list = document.createElement("ul");
                    list.className = "workout-list";

                    card.appendChild(title);
                    card.appendChild(list);
                    history.appendChild(card);
                }

                var item = document.createElement("li"); // Colocar o exercício no card desse dia.
                item.textContent =
                    works[i].name + " - " +
                    works[i].sets + " séries";

                var actions = document.createElement("div");
                actions.className = "workout-actions";

                var editButton = document.createElement("button");
                editButton.type = "button";
                editButton.className = "btn-cancel";
                editButton.textContent = "Editar";
                editButton.dataset.workoutId = works[i].id;
                editButton.onclick = function () {
                    editWork(Number(this.dataset.workoutId));
                };

                var removeButton = document.createElement("button");
                removeButton.type = "button";
                removeButton.className = "btn-cancel workout-remove";
                removeButton.textContent = "Remover";
                removeButton.dataset.workoutId = works[i].id;
                removeButton.onclick = function () {
                    removeWork(Number(this.dataset.workoutId));
                };

                actions.appendChild(editButton);
                actions.appendChild(removeButton);
                item.appendChild(actions);
                list.appendChild(item);
            }
        }
        
        // editar treino
        function editWork(workoutId) {
            for (var i = 0; i < works.length; i++) {
                if (works[i].id == workoutId) {
                    input_exerciseName.value = works[i].name;
                    select_muscleGroup.value = works[i].muscleGroup;
                    input_sets.value = works[i].sets;
                    input_workoutDate.value = works[i].date;
                    editingWorkoutId = workoutId;
                    document.getElementById("workoutModalTitle").textContent = "Editar treino";
                    document.getElementById("workoutModalDescription").textContent = "Altere os dados deste exercício.";
                    document.getElementById("workoutSubmitButton").textContent = "Salvar alterações";
                    modal_work.style.display = "flex";
                    return;
                }
            }
        }

        // remover treino
        function removeWork(workoutId) {
            if (!confirm("Deseja remover este exercício?")) {
                return;
            }

            var userId = sessionStorage.getItem("userId");

            fetch("/workouts/" + userId + "/" + workoutId, {
                method: "DELETE"
            }).then(function (response) {
                if (response.ok) {
                    alert("Exercício removido com sucesso!");
                    loadWorkouts();
                } else {
                    alert("Não foi possível remover o exercício.");
                }
            }).catch(function (error) {
                console.error(error);
                alert("Não foi possível conectar ao servidor.");
            });
        }
        // registrar treino
        function registerWork() {
            var userId = sessionStorage.getItem("userId");
            var name = input_exerciseName.value.trim();
            var muscleGroup = select_muscleGroup.value.trim();
            var sets = Number(input_sets.value.trim());
            var date = input_workoutDate.value.trim();

            var Valid = true;

            if (name == "" || name.length > 45 || muscleGroup == "" || !Number.isInteger(sets) || sets <= 0 || date == "") {
                alert("Preencha todos os campos corretamente.");
                Valid = false;
            }

            if (Valid) {
                var url = "/workouts/" + userId;
                var method = "POST";
                var successMessage = "Treino registrado com sucesso!";
                var errorMessage = "Não foi possível registrar o treino.";

                if (editingWorkoutId != null) {
                    url += "/" + editingWorkoutId;
                    method = "PUT";
                    successMessage = "Treino atualizado com sucesso!";
                    errorMessage = "Não foi possível atualizar o treino.";
                }

                fetch(url, {
                    method: method,
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name,
                        muscleGroup,
                        sets,
                        date
                    })
                }).then(function (response) {
                    if (response.ok) {
                        alert(successMessage);
                        closeModalWork();
                        loadWorkouts();
                    } else {
                        alert(errorMessage);
                    }
                }).catch(function (error) {
                    console.error(error);
                    alert("Não foi possível conectar ao servidor.");
                });
            }
        }

        function loadWorkouts() {
            var userId = sessionStorage.getItem("userId");

            fetch("/workouts/" + userId)
                .then(function (response) {
                    if (response.ok) {
                        return response.json().then(function (data) {
                            works = data;
                            renderWorkouts();
                        });
                    } else {
                        alert("Não foi possível buscar os treinos.");
                    }
                })
                .catch(function (error) {
                    console.error(error);
                    alert("Não foi possível carregar os treinos.");
                });
        }

        if (sessionStorage.getItem("userId")) {
            loadWorkouts();
        }
    </script>
