<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gymTECH · Treinos</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <script src="../js/sessao.js"></script>
</head>

<body>
    <!-- MENU LATERAL -->
    <div class="app">
        <div class="sidebar">
            <a class="logo" href="../index.html">gym<span>TECH</span></a>
            <div class="menu">
                <a href="painel.html" class="menu-item menu-active">Painel</a>
                <a href="#" class="menu-item menu-active">Meus treinos</a>
                <a href="#" class="menu-item menu-active">Exercícios</a>
                <a href="../index.html" class="menu-item menu-active">Menu</a>
            </div>

            <!-- AVATAR -->
            <div class="user">
                <div class="avatar avatar-small js-iniciais"></div>
                <div class="user-info">
                    <strong class="js-nome"></strong>
                    <a href="../login.html" onclick="limparSessao()">Sair</a>
                </div>
            </div>
        </div>

        <div class="works-wrapper">
            <!-- CONTEÚDO PRINCIPAL-->
            <div class="content">
                <p id="mensagemErro" class="erro" hidden>Não foi possível carregar os dados.</p>

                <!-- HEADER -->
                <div class="topbar">
                    <div class="topbar-user">
                        <div class="avatar js-iniciais"></div>
                        <div>
                            <h1>Histórico de treinos <span class="js-nome"></span></h1>
                            <p id="subtitulo" class="muted small"></p>
                        </div>
                    </div>
                    <a class="btn" onclick="openModalWork()">+ Registrar treino</a>
                </div>

                <!-- TREINOS RECENTES -->
                <section>
                    <h2>Histórico de treinos</h2>
                    <div id="workoutHistory" class="workout-history"></div>
                </section>
            </div>
        </div>
    </div>

    <!-- MODAL DE CADASTRO DE TREINOS -->
    <div id="modal_work" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h2>Registrar treino</h2>
                    <p class="muted small">Preencha os dados do seu treino.</p>
                </div>
                <button type="button" class="btn-fechar" onclick="closeModalWork()" aria-label="Fechar modal">
                    ×
                </button>
            </div>

            <form class="form" onsubmit="event.preventDefault(); registerWork();">
                <div class="form-field">
                    <label for="ipt_nameExerc">Nome do exercício</label>
                    <input type="text" id="ipt_nameExerc" placeholder="Ex.: Supino inclinado" required>
                </div>

                <div class="form-field">
                    <label for="ipt_typeMusc">Grupo muscular</label>
                    <select id="ipt_typeMusc" required>
                        <option value="" disabled selected>Selecione um grupo</option>
                        <option value="peito">Peito</option>
                        <option value="costas">Costas</option>
                        <option value="ombros">Ombros</option>
                        <option value="pernas">Pernas</option>
                        <option value="biceps">Bíceps</option>
                        <option value="triceps">Tríceps</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="ipt_qtdSets">Quantidade de séries</label>
                    <input type="number" id="ipt_qtdSets" placeholder="Ex.: 3" min="1" required>
                </div>

                <div class="form-field">
                    <label for="ipt_dateWork">Data do treino</label>
                    <input type="date" id="ipt_dateWork" required>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="closeModalWork()">
                        Cancelar
                    </button>
                    <button type="submit" class="btn-confirm">
                        Registrar treino
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script>
        validarSessao()

        // ABRIR E FECHAR OS MODAIS
        function openModalWork() {
            modal_work.style.display = "flex";
        }

        function closeModalWork() {
            modal_work.style.display = "none";
        }


        var works = [];

        function registerWork() {
            var userId = sessionStorage.getItem("userId");
            var name = ipt_nameExerc.value.trim();
            var typeMusc = ipt_typeMusc.value.trim();
            var qtdSets = Number(ipt_qtdSets.value.trim());
            var date = ipt_dateWork.value.trim();

            var Valid = true;

            if (name == "" || typeMusc == "" || qtdSets <= 0 || date == "") {
                alert("Preencha todos os campos corretamente.");
                Valid = false;
            }

            if (Valid) {
                fetch("/workouts/" + userId, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: name,
                        muscleGroup: typeMusc,
                        sets: qtdSets,
                        date: date
                    })
                }).then(function (response) {
                    if (response.ok) {
                        alert("Treino registrado com sucesso!");
                        closeModalWork();
                        loadWorkouts();
                    } else {
                        alert("Não foi possível registrar o treino.");
                    }
                }).catch(function (error) {
                    console.error(error);
                    alert("Não foi possível conectar ao servidor.");
                });
            }
        }

        function loadWorkouts() {
            var userId = sessionStorage.getItem("userId");

            fetch("/workouts/" + userId)
                .then(function (response) {
                    if (response.ok) {
                        return response.json().then(function (data) {
                            works = data;

                            var list = document.getElementById("listaRecentes");
                            list.innerHTML = "";

                            if (works.length == 0) {
                                list.textContent = "Você ainda não registrou treinos.";
                            }

                            for (var i = 0; i < works.length; i++) {
                                var item = document.createElement("li");

                                item.textContent =
                                    works[i].name + " - " +
                                    works[i].sets + " séries - " +
                                    works[i].date;

                                list.appendChild(item);
                            }
                        });
                    } else {
                        alert("Não foi possível buscar os treinos.");
                    }
                })
                .catch(function (error) {
                    console.error(error);
                    alert("Não foi possível carregar os treinos.");
                });
        }

        if (sessionStorage.getItem("userId")) {
            loadWorkouts();
        }
    </script>
</body>

</html>
